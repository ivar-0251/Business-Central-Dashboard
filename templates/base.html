<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Verver Export Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='base.css', v=5) }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='verver.png') }}">
    <style>
        body {
            background-image: url("{{ url_for('static', filename='tulip_background.png') }}");
            background-position: center;
            background-attachment: fixed;
            background-size: cover;
        }
    </style>
</head>
<body>
    <img class="site-logo" src="{{ url_for('static', filename='verver.png') }}" alt="Verver Export">
    {% block webapp %}
    <main class="site-shell">
        <header class="site-header">
            <div class="header-top">
                <a class="brand" href="{{ url_for('dashboard') }}">
                    <span class="eyebrow">Verver Export</span>
                    <span class="brand-name">Dashboard</span>
                </a>
                <div class="header-actions">
                    {% if last_updated %}
                    <span class="last-updated">Bijgewerkt {{ last_updated }}</span>
                    {% endif %}
                    {% block header_actions_extra %}{% endblock %}
                </div>
            </div>
            <nav class="site-nav" aria-label="Hoofdnavigatie">
                <a href="{{ url_for('colli') }}">Colli</a>
                <a href="{{ url_for('verzendingen') }}">Verzendingen</a>
                <details class="site-nav-dropdown">
                    <summary>Agenda</summary>
                    <div class="site-nav-dropdown-menu">
                        <a href="{{ url_for('agenda_algemeen') }}">Algemeen</a>
                        <a href="{{ url_for('agenda_planning') }}">Planning</a>
                    </div>
                </details>
            </nav>
        </header>

        {% block content %}{% endblock %}
    {% endblock %}
    <script>
        function printOverview() {
            const printUrl = new URL("{{ url_for('print_overview') }}", window.location.href);
            printUrl.searchParams.set(
                "return_to",
                window.location.pathname + window.location.search
            );
            window.location.assign(printUrl);
        }

        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('a[href*="businesscentral.dynamics.com"]').forEach(function (link) {
                link.setAttribute('target', '_blank');
                link.setAttribute('rel', 'noopener noreferrer');
            });
        });
    </script>
</body>
</html>
